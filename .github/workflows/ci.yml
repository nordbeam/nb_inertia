name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  javascript:
    name: JavaScript (Vite+)
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Vite+
      uses: voidzero-dev/setup-vp@v1.18.0
      with:
        cache: true
        run-install: true

    - name: Install React adapter dependencies
      run: vp install
      working-directory: priv/nb_inertia/react

    - name: Install Vue adapter dependencies
      run: vp install
      working-directory: priv/nb_inertia/vue

    - name: Build library
      run: vp build

    - name: Verify GitHub-installable package layout
      run: |
        node --input-type=module <<'NODE'
          import { execFileSync } from "node:child_process";
          import fs from "node:fs";
          import os from "node:os";

          const packageJson = JSON.parse(fs.readFileSync("package.json", "utf8"));
          const requiredFiles = [
            "dist/react/useForm.js",
            "dist/react/useForm.d.ts",
            "priv/nb_inertia/vue/modals/index.d.ts",
          ];

          if (packageJson.repository?.url !== "git+https://github.com/nordbeam/nb_inertia.git") {
            throw new Error("package.json must point GitHub installs at nordbeam/nb_inertia");
          }
          if (packageJson.private !== true) {
            throw new Error("package.json must be private; install the package from GitHub");
          }

          const packResult = JSON.parse(
            execFileSync(
              "npx",
              [
                "--yes",
                "npm@12.0.2",
                "pack",
                process.cwd(),
                "--dry-run",
                "--ignore-scripts",
                "--json",
              ],
              {
                // Run npm 12 outside the package root so the runner's npm
                // version cannot fail this repository's devEngines check.
                cwd: os.tmpdir(),
                encoding: "utf8",
              },
            ),
          );
          const packInfo = packResult[packageJson.name];

          if (!packInfo || !Array.isArray(packInfo.files)) {
            throw new Error(`npm 12 pack output is missing ${packageJson.name}`);
          }

          const packedFiles = new Set(packInfo.files.map(({ path }) => path));

          for (const [exportName, exportSpec] of Object.entries(packageJson.exports)) {
            for (const field of ["import", "types"]) {
              const target = exportSpec[field];
              if (typeof target !== "string") continue;
              if (!packedFiles.has(target.slice(2))) {
                throw new Error(`${exportName} target is not packed: ${target}`);
              }
            }
          }

          for (const file of requiredFiles) {
            if (!fs.existsSync(file)) throw new Error(`Missing package file: ${file}`);
          }
        NODE

    - name: Test React adapter
      run: vp test run
      working-directory: priv/nb_inertia/react

    - name: Test Vue adapter
      run: vp test run
      working-directory: priv/nb_inertia/vue

  test:
    name: Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - elixir: '1.15'
            otp: '25'
          - elixir: '1.20'
            otp: '29'

    steps:
    - uses: actions/checkout@v7

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: ${{ matrix.elixir }}
        otp-version: ${{ matrix.otp }}

    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-${{ matrix.otp }}-${{ matrix.elixir }}-

    - name: Install dependencies
      run: mix deps.get

    - name: Compile
      run: mix compile --warnings-as-errors

    - name: Run tests
      run: mix test

    - name: Run performance gate
      run: mix nb_inertia.perf_gate
      if: matrix.elixir == '1.20' && matrix.otp == '29'

    - name: Check formatting
      run: mix format --check-formatted
      if: matrix.elixir == '1.20' && matrix.otp == '29'

    - name: Run Credo
      run: mix credo --strict
      if: matrix.elixir == '1.20' && matrix.otp == '29'

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Elixir
      uses: erlef/setup-beam@v1
      with:
        elixir-version: '1.20'
        otp-version: '29'

    - name: Restore dependencies cache
      uses: actions/cache@v6
      with:
        path: |
          deps
          _build
        key: ${{ runner.os }}-mix-29-1.20-${{ hashFiles('**/mix.lock') }}
        restore-keys: |
          ${{ runner.os }}-mix-29-1.20-

    - name: Install dependencies
      run: mix deps.get

    - name: Run coverage
      run: mix coveralls.json
      env:
        MIX_ENV: test

    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v7
      with:
        files: ./cover/excoveralls.json
        flags: nb_inertia
        fail_ci_if_error: false
